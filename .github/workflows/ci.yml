# CI — gates every PR into main (trunk-based development).
# Checks: full bun check suite of pi-delegate + changelog gate
# (a version bump requires a matching CHANGELOG section).
# Note: this repo IS the package — one package.json, no version sync
# (the old root+extension dual-version law died with the ai-sandbox bundle).

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the changelog gate below computes git merge-base
          # against the base branch — impossible in a shallow clone (depth 1
          # kills the gate with a bare exit 1 before any error line prints).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: an unrelated bun release must not flip the gate; bumps
          # are deliberate (change this line explicitly).
          bun-version: 1.4.2

      # typebox is an optional peerDependency — the repo carries bun.lock but
      # no node_modules, and the check scripts spawn bun subprocesses that
      # must resolve it (bare runner → E_RESOLVE without this step).
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Changelog gate: if the PR bumps the version in package.json
      # (relative to the merge base), a matching '## [x.y.z]' section must
      # already exist in CHANGELOG.md. Extraction logic mirrors the release
      # workflow's notes step — the same section the release job will later
      # publish. A bump without a section fails the PR instead of failing
      # the post-merge release job.
      - name: Changelog gate (a version bump requires a CHANGELOG section)
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          mb=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          git show "$mb:package.json" > /tmp/old-package.json
          old=$(node -p "require('/tmp/old-package.json').version")
          new=$(node -p "require('./package.json').version")
          echo "merge-base: $old | HEAD: $new"
          if [ "$old" = "$new" ]; then
            echo "version unchanged — no changelog section required"
            exit 0
          fi
          section=$(awk -v ver="[$new]" '
            /^## \[/ { if (found) exit; if (index($0, ver) != 0) { found=1; print; next } }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "::error::version changed $old → $new, but CHANGELOG.md has no '## [$new]' section — a version bump without a changelog section fails the PR (Keep a Changelog format)"
            exit 1
          fi
          echo "version bumped $old → $new — CHANGELOG section found"

      # Typecheck gate (Definition of Stable #1): bun typechecks nothing at
      # runtime, so strict-mode holes ship invisibly without this. typescript
      # is a pinned devDependency (7.x native compiler); the QA config is the
      # repo's own test/tsconfig.qa.json.
      - name: Typecheck (tsc --noEmit, QA config)
        run: bunx tsc --noEmit -p test/tsconfig.qa.json

      # Canonical runner: per-file timeout, at most one environment-flake
      # retry, an explicit ENV-FAIL verdict, and a non-zero exit on any FAIL
      # (protocol in test/run-checks.sh; it self-installs on a fresh
      # worktree). No `|| bun test` fallback — the old loop silently retried
      # failing files and eroded the FAIL/ENV-FAIL distinction. First FAIL
      # fails the job.
      - name: Run check suite
        run: ./test/run-checks.sh
